<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2D2420" />
  <meta name="description"
    content="Espresso calibration dashboard for the Ninja Luxe Cafe Pro. Track your shots and dial in the perfect espresso." />
  <title>Luxe Cafe Dial-In | Espresso Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="fc70e356-507c-4f48-9154-aa00d7099fd5"></script>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <style>
    html[data-theme="dark"], html:not([data-theme]) { background: #241C17; }
    html[data-theme="light"] { background: #F0EBE5; }
    html[data-theme="catppuccin"] { background: #181825; }
    html[data-theme="rosepine"] { background: #1f1d2e; }
    html[data-theme="rosepine-moon"] { background: #2a273f; }
    html[data-theme="fadetouched"] { background: #11201e; }
    body { margin: 0; visibility: hidden; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Register service worker for PWA support (production only).
    // In dev, unregister any existing worker and clear its caches so the live server never serves stale assets.
    if ('serviceWorker' in navigator) {
      var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isDev) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    }
  </script>
</body>

</html>
